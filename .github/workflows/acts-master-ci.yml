name: ACTS master + k4ActsTracking

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-acts-master:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/key4hep/key4hep-images/alma9-cvmfs
      options: --privileged
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone ACTS master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: acts-project/acts
          path: acts
          ref: main

      - name: Mount CVMFS
        run: /mount.sh

      - run: echo "NOW=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.cache/ccache
          key: ccache-acts-master-${{ env.NOW }}
          restore-keys: |
            ccache-acts-master-

      - name: Build and test
        run: |
          set -eo pipefail
          source /cvmfs/sw-nightlies.hsf.org/key4hep/setup.sh --lcg

          export CCACHE_DIR=/root/.cache/ccache
          export CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime
          ccache --set-config=max_size=500M
          ccache -z

          # Build ACTS from master
          echo "=== Building ACTS from master ==="
          cd "$GITHUB_WORKSPACE/acts"
          cmake -B build -S . -GNinja \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DACTS_BUILD_PLUGIN_DD4HEP=ON \
            -DACTS_BUILD_PLUGIN_EDM4HEP=ON \
            -DACTS_BUILD_PLUGIN_JSON=ON \
            -DACTS_BUILD_UNITTESTS=OFF \
            -DACTS_USE_SYSTEM_LIBS=ON \
            -DACTS_SETUP_DETRAY=OFF \
            -DACTS_SETUP_VECMEM=OFF
          cmake --build build -- -k 0 -j$(nproc)
          cmake --install build
          k4_local_repo

          echo "=== Building k4ActsTracking ==="
          cd "$GITHUB_WORKSPACE"
          k4_local_repo
          mkdir -p build
          cd build
          # Defer the exempted warnings to the final check so all sources and tests run.
          cmake .. \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_INSTALL_PREFIX=../install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-Werror -Wno-error=cpp -Wno-error=deprecated-declarations" \
            -GNinja
          cmake --build . -- -k 0 -j$(nproc) 2>&1 | tee build.log

          echo "=== Running tests ==="
          ctest -j $(nproc) --output-on-failure

          cmake --build . --target install

          ccache -s

      - name: Check deferred compiler warnings
        if: ${{ !cancelled() }}
        run: |
          log="$GITHUB_WORKSPACE/build/build.log"
          if [[ -f "$log" ]] && grep -E -- '\[-W(deprecated-declarations|cpp)\]' "$log"; then
            echo "::error::Deprecation or #warning diagnostics found; see the build log above."
            exit 1
          fi

      - name: Upload build and CTest logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CTest logs_acts-master_run${{ github.run_id }}_attempt${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/build/build.log
            ${{ github.workspace }}/build/Testing/Temporary
            !${{ github.workspace }}/build/Testing/Temporary/CTestCostData.txt
          if-no-files-found: warn
          retention-days: 3

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: /root/.cache/ccache
          key: ccache-acts-master-${{ env.NOW }}
